<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loach</title>
    <!-- No inline <style> here, ever. At build time Tauri gives every inline
         <style> a nonce and adds it to the CSP's `style-src`, and once a nonce
         is there CSP3 ignores `'unsafe-inline'` — which blocks the <style> tags
         Radix ScrollArea and react-remove-scroll-bar inject at runtime, in
         release builds only. The dark first frame needs nothing extra: the
         bundle's stylesheet is linked in <head>, so it's render-blocking, and
         it paints `body` dark under the `dark` class above; before any page
         paint the window shows its `backgroundColor` (tauri.conf.json). -->
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
