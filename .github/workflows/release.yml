name: Release

# Cuts a release when main contains a version bump paired with a matching
# release-notes file. On push to main, the prepare job reads `version` from
# package.json. If `releases/<version>.md` exists AND the matching v<version>
# tag doesn't, it kicks off the build matrix. Otherwise it silently no-ops —
# normal feature merges don't trigger anything.
#
# The notes file content becomes both the GitHub release body AND the `notes`
# field inside `latest.json`, so what the user sees in-app matches what's on
# the GitHub release page.

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual re-run if CI flaked

permissions:
  contents: write

# One release run at a time. The gate below decides whether to ship by
# checking that the `v$PKG` tag does NOT exist yet — a read that happens
# before any run creates it. Two pushes landing on main close together would
# therefore both read "no tag", both answer `should_release=true`, and race
# two full build matrices into the same tag and release: duplicate asset
# uploads fail one of them and leave a half-populated draft behind.
#
# `cancel-in-progress: false` on purpose — never kill a release mid-build.
# The queued run starts only after the first finishes, by which point the tag
# exists and its own gate soft-skips, which is exactly the desired outcome.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  prepare:
    # Releases only ever come from main. The push trigger already guarantees
    # that, but `workflow_dispatch` lets you pick any ref — and the documented
    # flow stages the version bump + notes file on a dev branch BEFORE merge,
    # which is exactly the state the gate below says "ship it" to. Without
    # this guard a stray manual run on that branch would tag and draft-release
    # unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.gate.outputs.version }}
      should_release: ${{ steps.gate.outputs.should_release }}
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # need full history to inspect existing tags

      - id: gate
        name: Decide whether to release
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          TAURI=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          # Hard fail on version drift — that's a release-blocker bug, not a
          # "not a release" signal. The three files must agree before we ship.
          if [ "$PKG" != "$TAURI" ] || [ "$PKG" != "$CARGO" ]; then
            echo "::error::Version mismatch — package.json=$PKG, tauri.conf.json=$TAURI, Cargo.toml=$CARGO"
            exit 1
          fi

          echo "version=$PKG" >> "$GITHUB_OUTPUT"

          # Soft skip when there's no notes file: the absence is the signal
          # that this merge wasn't intended as a release.
          if [ ! -f "releases/$PKG.md" ]; then
            echo "::notice::releases/$PKG.md not found — skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Soft skip when the tag already exists — keeps re-runs idempotent.
          if git rev-parse "v$PKG" >/dev/null 2>&1; then
            echo "::notice::Tag v$PKG already exists — skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - id: notes
        if: steps.gate.outputs.should_release == 'true'
        name: Read release notes
        run: |
          set -euo pipefail
          VERSION="${{ steps.gate.outputs.version }}"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            # printf %s\n guarantees a trailing newline even if the notes file
            # doesn't end with one — otherwise the closing delimiter lands on
            # the same line as the last content line and the parser can't see it.
            printf '%s\n' "$(cat "releases/$VERSION.md")"
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      # Push the tag before anything builds. The gate above keys on it, and
      # nothing else creates it in time: tauri-action only drafts the release,
      # and GitHub creates a draft's tag when the draft is published. Without
      # this, a push to main between the draft and Publish passed the gate
      # again and rebuilt the draft's assets from the newer commit.
      - name: Tag the release commit
        if: steps.gate.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          TAG="v${{ steps.gate.outputs.version }}"
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"

  build:
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis'
          # Built inside an Ubuntu 22.04 container on the 24.04 runner. The
          # 22.04 *runner image* is being retired (deprecation began
          # 2026-09-17), but bundling against 24.04's glibc 2.39 would lock out
          # every user still on Ubuntu 22.04 or Debian 12 — and the updater
          # can't detect that, so they'd just get a binary that won't start.
          # The container keeps the artifacts on glibc 2.35 while the job
          # itself runs on a supported runner image.
          - platform: ubuntu-24.04
            container: ubuntu:22.04
            args: '--bundles deb,appimage,rpm'
          # Apple Silicon only — macos-14 is an M1 runner, so the target
          # matches the host arch and no extra `rustup target add` is needed.
          # We're not signing with Apple (no Developer Program subscription);
          # signingIdentity: "-" in tauri.conf.json applies an ad-hoc signature
          # that satisfies the updater bundle's structural checks but not
          # Gatekeeper. Users must bypass Gatekeeper on first launch — see
          # README.md "Install on macOS".
          - platform: macos-14
            args: '--target aarch64-apple-darwin --bundles app,dmg'

    runs-on: ${{ matrix.platform }}
    container: ${{ matrix.container }}
    steps:
      # The bare ubuntu:22.04 image ships neither git nor curl, and this must
      # run *before* checkout: with no git present, actions/checkout quietly
      # falls back to a tarball download and leaves no .git behind, which
      # breaks tauri-action's tag creation. `safe.directory` because the
      # container runs as root against a workspace owned by the runner user.
      - name: Bootstrap container
        if: matrix.container != ''
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates xz-utils sudo
          git config --global --add safe.directory '*'

      - uses: actions/checkout@v7
        with:
          # Tauri-action needs full history to compute the right tag base
          # for the auto-created tag. Matches `prepare`'s checkout.
          fetch-depth: 0

      # Runs as root inside the container, so no sudo. build-essential,
      # pkg-config and libssl-dev come preinstalled on the runner image but
      # are absent from the bare base image — as are `file` and `wget`, which
      # the AppImage bundler shells out to (see the Dockerfile, which keeps the
      # same list for local builds).
      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm \
            file \
            wget \
            desktop-file-utils

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # Pin to a specific stable release rather than tracking `@stable`. A
      # surprise rustc release between merges can otherwise break a release
      # build with no recourse — and a green release build on Monday with
      # a red one on Tuesday from no source change is exactly the kind of
      # opaque failure that costs hours to diagnose. Bump this manually
      # when intentionally adopting a new toolchain.
      #
      # 1.90.0 is the floor imposed by current deps: `tauri` 2.12 and its
      # plugins, `muda` and `tray-icon` need 1.90+; before them `darling`,
      # `image`, `serde_with`, `time` set it at 1.88.
      - uses: dtolnay/rust-toolchain@1.90.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Signs the macOS app with a stable self-signed identity instead of the
      # ad-hoc one in tauri.conf.json, once the two MACOS_SIGNING_* secrets
      # exist. Gatekeeper treats both alike (neither is notarized); the
      # Keychain doesn't. It ties Loach's saved items (API key, app-lock hash)
      # to the signature's designated requirement, and an ad-hoc requirement
      # is the binary's own hash — so after every update macOS took Loach for
      # a different app and asked for the login password before it could read
      # its own secrets. A certificate's requirement stays the same across
      # builds. (Installs updating from an ad-hoc build are asked once more.)
      #
      # Not tauri's own APPLE_CERTIFICATE import: that only looks for
      # Apple-issued certificates ("Developer ID Application:" …) and fails on
      # a self-signed one. Exporting APPLE_SIGNING_IDENTITY instead makes the
      # bundler run plain `codesign -s <identity>` against the keychain search
      # list, skipping notarization as it does now. Any problem here falls
      # back to the ad-hoc signature with a warning rather than failing the
      # leg — by then another leg may already have pushed the tag.
      #
      # One-time setup, with OpenSSL (in Git Bash, prefix each command with
      # MSYS_NO_PATHCONV=1 so `-subj` isn't rewritten into a Windows path):
      #   openssl req -x509 -newkey rsa:2048 -sha256 -days 3650 -nodes \
      #     -keyout loach-signing.key -out loach-signing.crt \
      #     -subj "/CN=Loach Code Signing" \
      #     -addext "keyUsage=critical,digitalSignature" \
      #     -addext "extendedKeyUsage=critical,codeSigning"
      #   openssl pkcs12 -export -inkey loach-signing.key -in loach-signing.crt \
      #     -keypbe PBE-SHA1-3DES -certpbe PBE-SHA1-3DES -macalg sha1 \
      #     -out loach-signing.p12
      # (SHA1/3DES because macOS `security import` rejects OpenSSL 3's default
      # PKCS#12 encryption.) Store `openssl base64 -A -in loach-signing.p12` as
      # MACOS_SIGNING_CERTIFICATE and the export password as
      # MACOS_SIGNING_CERTIFICATE_PASSWORD. Keep the .p12 as private as the
      # updater key — whoever holds it can sign an app the Keychain takes for
      # Loach — and keep it: a replacement costs every install another prompt.
      - name: Import macOS signing identity
        if: matrix.platform == 'macos-14'
        env:
          MACOS_SIGNING_CERTIFICATE: ${{ secrets.MACOS_SIGNING_CERTIFICATE }}
          MACOS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          # The default shell runs with -e; every failure below is handled
          # explicitly so it can fall back to ad-hoc instead.
          set +e -uo pipefail
          adhoc() {
            echo "::warning::$1 — this build keeps the ad-hoc signature."
            exit 0
          }
          if [ -z "$MACOS_SIGNING_CERTIFICATE" ]; then
            echo "::notice::MACOS_SIGNING_CERTIFICATE not set — keeping the ad-hoc signature."
            exit 0
          fi
          KC="$RUNNER_TEMP/loach-signing.keychain-db"
          KC_PW=$(openssl rand -hex 16)
          P12="$RUNNER_TEMP/loach-signing.p12"
          trap 'rm -f "$P12"' EXIT
          printf '%s' "$MACOS_SIGNING_CERTIFICATE" | base64 --decode > "$P12" \
            || adhoc "MACOS_SIGNING_CERTIFICATE isn't valid base64"
          security create-keychain -p "$KC_PW" "$KC" || adhoc "couldn't create a keychain"
          # No auto-lock: the release build can outlast any timeout.
          security set-keychain-settings "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$P12" -k "$KC" -P "$MACOS_SIGNING_CERTIFICATE_PASSWORD" -T /usr/bin/codesign \
            || adhoc "couldn't import the certificate (wrong password, or not a SHA1/3DES .p12?)"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KC" >/dev/null \
            || adhoc "couldn't let codesign use the key"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # Self-signed, so it's listed as untrusted, which codesign doesn't
          # mind. The SHA-1 names it unambiguously.
          ID=$(security find-identity -p codesigning "$KC" | grep -m1 -oE '[0-9A-F]{40}') \
            || adhoc "no code-signing identity in MACOS_SIGNING_CERTIFICATE"
          # Sign a scratch binary the way the bundler will before relying on it.
          cp /usr/bin/true "$RUNNER_TEMP/probe"
          codesign --force -s "$ID" --options runtime "$RUNNER_TEMP/probe" \
            && codesign --verify "$RUNNER_TEMP/probe" \
            || adhoc "codesign refused the identity"
          codesign -d -r- "$RUNNER_TEMP/probe"
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # appimagetool mounts itself through FUSE, which a container does not
          # provide; this makes it self-extract instead. Harmless elsewhere.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          # The `prepare` job already pushed this tag at the commit being
          # built. First matrix job to finish creates the release; subsequent
          # jobs upload their assets to the same one.
          tagName: v${{ needs.prepare.outputs.version }}
          releaseName: 'Loach v${{ needs.prepare.outputs.version }}'
          releaseBody: ${{ needs.prepare.outputs.release_body }}
          releaseDraft: true
          # Anything with a pre-release qualifier (e.g. `-alpha`, `-beta`,
          # `-rc.1`) is flagged prerelease; bare `1.2.3` ships as stable.
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          # Since v1 the `url`s in latest.json are API asset links
          # (api.github.com/.../releases/assets/<id>), stable across the
          # draft -> publish switch. Every shipped install (updater plugin
          # 2.10.1+) downloads them fine: it sends Accept:
          # application/octet-stream and follows the redirect to the file.
          uploadUpdaterJson: true
          args: ${{ matrix.args }}
