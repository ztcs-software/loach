name: CI

# Runs the checks the release checklist expects to be green — the TypeScript
# build, the Vitest suite (which includes the release version-agreement
# gate in tests/versions.test.ts), and the Rust unit tests. Releases are
# handled by release.yml; this workflow never publishes anything.
#
# Triggers on pushes to main so each merge commit gets its own verdict, and
# on PRs to main so the merge gate sees a check before merge. Dev branches
# get CI once they open a PR. NOTE: this workflow does NOT
# gate release.yml — both fire on the same push-to-main event and run in
# parallel, and release.yml drafts its release without waiting for CI (the
# draft still needs a manual publish, which is the human backstop). The
# actual merge gate is branch protection: mark this file's four job names
# ("tsc + vite build + vitest", "cargo test", "cargo check (windows)",
# "cargo check (macos)") as required status checks on `main`.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One in-flight run per event+ref: a new push to a PR branch obsoletes the
# previous run, so cancel it. On main itself, never cancel — a superseded
# main run that gets cancelled would leave that (possibly released) merge
# commit with no completed CI verdict.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  js:
    name: tsc + vite build + vitest
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  rust:
    name: cargo test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Same link-time deps as release.yml, minus the packaging-only tools
      # (patchelf, rpm) — cargo test compiles the Tauri app but bundles
      # nothing.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev

      # Pinned to the same toolchain as release.yml so a surprise rustc
      # release can't make CI and the release build disagree. Bump both
      # together.
      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # --locked: a Cargo.lock that drifted from Cargo.toml is a release
      # blocker (release.yml builds from the lockfile) — fail here instead.
      - run: cargo test --locked
        working-directory: src-tauri

  # Windows-only compile check. The `rust` job above runs on Linux, which
  # never compiles the `#[cfg(windows)]` arms — e.g. the CREATE_NO_WINDOW
  # flag in src/ollama_launch.rs. A mistake in one of those would pass every
  # PR check and first fail inside release.yml's build matrix, potentially
  # after another platform's job has already pushed the tag (which then
  # forces the delete-tag-and-draft recovery dance). `check` rather than
  # `test`: the point is that the platform's code compiles, and the tests
  # themselves are platform-independent.
  rust-windows:
    name: cargo check (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --locked --all-targets
        working-directory: src-tauri

  # macOS-only compile check. Until this existed, the macOS target was built
  # for the FIRST time inside release.yml's matrix — so a mistake in a
  # `#[cfg(target_os = "macos")]` arm (the `open -a` launch path in
  # commands.rs, the `icon_as_template` tray call in lib.rs) surfaced during
  # a release, and if another leg of the matrix had already pushed the tag
  # by then, recovery meant deleting the tag and the draft. Nobody on the
  # team has a Mac to catch it locally either, which makes CI the only
  # place it can be caught at all.
  #
  # `macos-14` is an M1 runner, so the host arch already IS
  # aarch64-apple-darwin — the same target release.yml builds — and no
  # `rustup target add` is needed. `check` rather than `test` for the same
  # reason as the Windows job: the tests are platform-independent, and the
  # question here is only whether the platform's code compiles.
  rust-macos:
    name: cargo check (macos)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo check --locked --all-targets
        working-directory: src-tauri
