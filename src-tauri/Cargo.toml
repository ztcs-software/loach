[package]
name = "loach"
version = "1.4.0"
description = "Native local LLM chat client (Ollama + OpenAI-compatible)."
authors = ["Loach"]
license = "MIT"
edition = "2021"
rust-version = "1.88"

[lib]
name = "loach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "http2", "gzip", "brotli"], default-features = false }
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
rusqlite = { version = "0.40", features = ["bundled"] }
# r2d2 + r2d2_sqlite back the read-only connection pool. The writer still
# goes through `Mutex<Connection>` so transactions keep their existing
# semantics; the pool is purely an additive parallelism win for hot SELECT
# paths (list_sessions, list_messages, list_space_*, get_*) that would
# otherwise queue behind every other DB op including unrelated writes.
r2d2 = "0.8"
r2d2_sqlite = "0.35"

# Secrets
keyring = { version = "4", default-features = false, features = ["v1"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# Utilities
uuid = { version = "1", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
# IANA timezone database for the built-in `datetime` tool (DST-aware
# tz conversions, "47 business days from today"-style arithmetic).
chrono-tz = "0.10"
base64 = "0.23"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dashmap = "6"
parking_lot = "0.12"


# Backing crates for the rest of the built-in tools. Each is small,
# pure-Rust, and pulled in only because the model can't do the task
# reliably itself (hash digests, IP arithmetic, natural sort, line diffs).
sha2 = "0.11"
similar = "3"
natord = "1"
ipnet = "2"

# PDF generation for the built-in `pdf` tool. printpdf builds documents
# from a structured spec and subsets a bundled Liberation Sans TTF (see
# src-tauri/assets/fonts) into each file, so output supports Unicode —
# Latin, European accents, common symbols — not just ASCII. Glyphs the
# font lacks (e.g. CJK, emoji) fall back to `?` at render time.
#
# `default-features = false` drops printpdf's `html` feature, which we never
# touch — the tool builds documents from a structured spec, not from markup.
# It was pulling the whole azul layout engine plus hyphenation, taffy,
# rust-fontconfig and two XML parsers: 21 crates of build time for APIs no
# call site references. Re-enable `html` if the tool ever grows an
# HTML-to-PDF path.
printpdf = { version = "0.12", default-features = false }

# Math expression evaluator for the built-in `calculate` tool. Local models
# are unreliable at arithmetic; this gives the model a way to off-load it
# without the user having to wire up an MCP server for a single function.
#
# Replaced meval (last released 2018), which pinned nom 1.2.4 — a version
# rustc already warns "will be rejected by a future version of Rust". exmex is
# maintained, MIT/Apache-2.0, and its own MSRV (1.80) sits under ours. See
# `tools/calculate.rs` for the two operators we add on top of its defaults.
exmex = "0.21"

# Total RAM + free disk for the onboarding model recommendation, which sizes
# the Ollama catalog against the machine instead of quoting raw GB. Only the
# `system` and `disk` collectors are compiled in — the default feature set also
# pulls process enumeration, networks, components and users, none of which we
# read. Held at 0.38: 0.39 raises its MSRV to 1.95, above our 1.88.
sysinfo = { version = "0.38", default-features = false, features = ["system", "disk"] }

# Windows VRAM + adapter name for the onboarding model recommendation, read via
# DXGI so it works for NVIDIA / AMD / Intel alike without vendor tooling. The
# crate is already in the tree (sysinfo pulls it in), so declaring it directly
# costs a feature set, not a new download. Linux reads nvidia-smi / sysfs and
# macOS needs nothing — see src/gpu.rs.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D12"] }

[dev-dependencies]
# Only used by the db.rs test suite, which opens a fresh database in a
# tempdir per test so we don't trample the user's real `loach.db` and so
# tests can run in parallel without sharing state.
tempfile = "3"

[features]
# this feature is used for production builds or when a dev server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Smaller binary → smaller NSIS installer + updater `.nsis.zip` download for
# every user on every release, and a faster cold start (Windows cold-start cost
# is roughly proportional to bytes read + Defender-scanned). `lto = "thin"`
# captures most of full LTO's size win for a fraction of the link time;
# `codegen-units = 1` lets the optimizer see the whole crate; `strip` drops the
# symbol table (a real win on the Linux/macOS artifacts — on Windows MSVC the
# symbols already live in a separate, unshipped PDB).
#
# Intentionally NOT set: `panic = "abort"` (Tauri commands rely on unwinding a
# panic and catching it — abort would turn any command panic into a full-app
# crash) and `opt-level = "s"` (would measurably slow the token-streaming serde
# hot path; the default opt-level = 3 stays).
lto = "thin"
codegen-units = 1
strip = "symbols"
