[package]
name = "loach"
version = "1.0.0"
description = "Native local LLM chat client (Ollama + OpenAI-compatible)."
authors = ["Loach"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "loach_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Async runtime + HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "http2", "gzip", "brotli"], default-features = false }
futures-util = "0.3"
async-stream = "0.3"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Storage
rusqlite = { version = "0.32", features = ["bundled"] }
# r2d2 + r2d2_sqlite back the read-only connection pool. The writer still
# goes through `Mutex<Connection>` so transactions keep their existing
# semantics; the pool is purely an additive parallelism win for hot SELECT
# paths (list_sessions, list_messages, list_space_*, get_*) that would
# otherwise queue behind every other DB op including unrelated writes.
r2d2 = "0.8"
r2d2_sqlite = "0.25"

# Secrets
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
anyhow = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell = "1"
dashmap = "6"
parking_lot = "0.12"

[dev-dependencies]
# Only used by the db.rs test suite, which opens a fresh database in a
# tempdir per test so we don't trample the user's real `loach.db` and so
# tests can run in parallel without sharing state.
tempfile = "3"

[features]
# this feature is used for production builds or when a dev server is not specified
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
