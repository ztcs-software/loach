<!doctype html>
<meta charset="utf-8">
<script>
  // Host page for the Code canvas's HTML preview, served by the
  // `loach-sandbox` protocol (src-tauri/src/sandbox.rs) with its own CSP.
  // The canvas frames it with `sandbox="allow-scripts allow-forms"`, waits
  // for "ready" and posts the HTML to show; this page then replaces itself
  // with that HTML, so it renders exactly once per load.
  (() => {
    // A sandboxed frame has an opaque origin, where merely reading
    // localStorage or sessionStorage throws — and generated demos (to-do
    // lists, games) read them on load. Give each render an in-memory
    // stand-in. document.open() keeps this window object, so the
    // replacements carry over into the written page.
    const memoryStorage = () => {
      const items = new Map();
      return {
        get length() { return items.size; },
        key: (i) => [...items.keys()][i] ?? null,
        getItem: (k) => items.get(String(k)) ?? null,
        setItem: (k, v) => void items.set(String(k), String(v)),
        removeItem: (k) => void items.delete(String(k)),
        clear: () => items.clear(),
      };
    };
    for (const name of ["localStorage", "sessionStorage"]) {
      try {
        Object.defineProperty(window, name, { value: memoryStorage(), configurable: true });
      } catch {
        /* leave the page to cope with the throwing original */
      }
    }

    // Pins `value` in place of `obj[name]`: the page can neither
    // reassign nor redefine it. Deliberately not in a try — if an engine
    // refuses, this script stops before "ready" and nothing renders.
    const pin = (obj, name, value) =>
      Object.defineProperty(obj, name, { value, writable: false, configurable: false });

    // The CSP stops every request the page could make except one: WebRTC,
    // whose ICE traffic to a STUN server carries whatever the page puts in
    // it. Take the constructors away, carried over like the storage above.
    for (const name of ["RTCPeerConnection", "webkitRTCPeerConnection", "RTCDataChannel"]) {
      pin(window, name, undefined);
    }

    // Everything below also runs after the page's own scripts, which share
    // this window and can replace any built-in they reach: a method, a
    // getter, an iterator, `Symbol.hasInstance`, `Function.prototype.call`.
    // A watcher calling the node's `matches` let through every frame once
    // the page had replaced it, and a wrapper going through `call` handed
    // the native itself to a page that had replaced `call`. So what's needed
    // is taken now, before any of the page runs, and only called via `apply`.
    const apply = Reflect.apply;
    const getter = (proto, name) => Object.getOwnPropertyDescriptor(proto, name).get;
    const { matches, querySelectorAll, remove, attachShadow } = Element.prototype;
    const nodeType = getter(Node.prototype, "nodeType");
    const addedNodes = getter(MutationRecord.prototype, "addedNodes");
    const listLength = getter(NodeList.prototype, "length");
    const { item } = NodeList.prototype;
    const { observe } = MutationObserver.prototype;
    const { slice } = String.prototype;
    const str = String;

    // A nested frame would bring fresh ones: a `srcdoc` or `javascript:`
    // frame runs its own script in a new window, and the CSP's frame-src
    // stops neither. So frames go as soon as they're added, in shadow roots
    // too, which `attachShadow` now reports here. The observer runs as a
    // microtask; a frame's first document (about:blank) is there at once,
    // but the sandbox gives it an opaque origin of its own, out of this
    // page's reach, and whatever the frame would run arrives in a later task.
    const FRAMES = "iframe, frame, object, embed";
    const removeFrames = (nodes) => {
      for (let i = 0, n = apply(listLength, nodes, []); i < n; i++) {
        const node = apply(item, nodes, [i]);
        if (apply(nodeType, node, []) !== 1) continue; // not an element
        if (apply(matches, node, [FRAMES])) apply(remove, node, []);
        const inner = apply(querySelectorAll, node, [FRAMES]);
        for (let j = 0, m = apply(listLength, inner, []); j < m; j++) {
          apply(remove, apply(item, inner, [j]), []);
        }
      }
    };
    // `records` is an array the engine builds; reading its own indices
    // involves nothing the page can replace.
    const frameWatch = new MutationObserver((records) => {
      for (let i = 0; i < records.length; i++) removeFrames(apply(addedNodes, records[i], []));
    });
    // No prototype, so a page can't add members to it through
    // Object.prototype (`attributes: false` plus `attributeOldValue: true`
    // made observe() throw, leaving a new shadow root unwatched).
    const OPTIONS = { __proto__: null, childList: true, subtree: true };
    const watch = (root) => apply(observe, frameWatch, [root, OPTIONS]);
    pin(Element.prototype, "attachShadow", function (init) {
      // Never clonable: cloneNode would copy the root, and what's in it,
      // into a new root nobody watches. Each field is read once into an
      // object of our own, so the page's object can't put the flag back.
      const root = apply(attachShadow, this, [{
        __proto__: null,
        mode: init?.mode,
        delegatesFocus: init?.delegatesFocus,
        slotAssignment: init?.slotAssignment,
        serializable: init?.serializable,
        customElementRegistry: init?.customElementRegistry,
        clonable: false,
      }]);
      watch(root);
      return root;
    });
    // A shadow root declared in markup doesn't pass through attachShadow,
    // and a closed one leaves no handle to watch. So the parser never gets
    // to make one: the attribute asking for it is renamed in everything
    // this page or its scripts hand to the parser. Matched character by
    // character, ASCII case-insensitively like the tokenizer, since a regex
    // or string method could be the page's own by now.
    const NAME = "shadowrootmode";
    const NAME_UPPER = "SHADOWROOTMODE";
    const isNameAt = (s, i) => {
      for (let j = 0; j < NAME.length; j++) {
        if (s[i + j] !== NAME[j] && s[i + j] !== NAME_UPPER[j]) return false;
      }
      return true;
    };
    const noShadowRoots = (html) => {
      const s = str(html);
      let out = "";
      let from = 0;
      for (let i = 0; i < s.length; i++) {
        if (!isNameAt(s, i)) continue;
        out += apply(slice, s, [from, i]) + "data-";
        from = i;
      }
      return out + apply(slice, s, [from]);
    };
    for (const [obj, name] of [
      [Element.prototype, "setHTMLUnsafe"],
      [ShadowRoot.prototype, "setHTMLUnsafe"],
      [Document, "parseHTMLUnsafe"],
      // The Sanitizer API's safe variants make one too once given a config.
      [Element.prototype, "setHTML"],
      [ShadowRoot.prototype, "setHTML"],
      [Document, "parseHTML"],
    ]) {
      const parse = obj[name];
      if (parse) pin(obj, name, function (html, options) {
        return apply(parse, this, [noShadowRoots(html), options]);
      });
    }
    // Writes all feed one stream, so a name can also arrive split across
    // two of them; a space at the start of the second splits it apart.
    let written = "";
    for (const name of ["write", "writeln"]) {
      const write = Document.prototype[name];
      pin(Document.prototype, name, function (...text) {
        let html = "";
        for (let i = 0; i < text.length; i++) html += str(text[i]);
        html = noShadowRoots(html);
        const seam = written + apply(slice, html, [0, NAME.length - 1]);
        for (let i = 0; i < seam.length; i++) {
          if (isNameAt(seam, i)) {
            html = " " + html;
            break;
          }
        }
        written = apply(slice, written + html, [1 - NAME.length]);
        return apply(write, this, [html]);
      });
    }

    // Typing or playing in here never reaches the app's own listeners: its
    // idle lock fired mid-game, and its panic key (Ctrl/Cmd+Shift+L) was dead
    // while this frame had focus. Tell the app — activity at most every few
    // seconds — in the two fixed messages it accepts. `parent` is taken now:
    // the page can replace that property on its window.
    const host = parent;
    let lastPing = 0;
    const ping = () => {
      const now = Date.now();
      if (now - lastPing < 5000) return;
      lastPing = now;
      host.postMessage({ type: "loach-preview:activity" }, "*");
    };
    const report = () => {
      for (const type of ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"]) {
        addEventListener(type, ping, { capture: true, passive: true });
      }
      addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey && String(e.key).toLowerCase() === "l") {
          host.postMessage({ type: "loach-preview:lock" }, "*");
        }
      }, { capture: true });
    };

    addEventListener("message", (e) => {
      const msg = e.data;
      if (e.source !== parent || msg?.type !== "loach-preview:render") return;
      document.open();
      // After open(), which erases this window's listeners, and before the
      // page's own scripts, so these run ahead of anything they add.
      report();
      watch(document);
      document.write(String(msg.html));
      document.close();
    });
    parent.postMessage({ type: "loach-preview:ready" }, "*");
  })();
</script>
