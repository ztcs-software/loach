<!doctype html>
<meta charset="utf-8">
<script>
  // Host page for the Code canvas's HTML preview, served by the
  // `loach-sandbox` protocol (src-tauri/src/sandbox.rs) with its own CSP.
  // The canvas frames it with `sandbox="allow-scripts allow-forms"`, waits
  // for "ready" and posts the HTML to show; this page then replaces itself
  // with that HTML, so it renders exactly once per load.
  (() => {
    // A sandboxed frame has an opaque origin, where merely reading
    // localStorage or sessionStorage throws — and generated demos (to-do
    // lists, games) read them on load. Give each render an in-memory
    // stand-in. document.open() keeps this window object, so the
    // replacements carry over into the written page.
    const memoryStorage = () => {
      const items = new Map();
      return {
        get length() { return items.size; },
        key: (i) => [...items.keys()][i] ?? null,
        getItem: (k) => items.get(String(k)) ?? null,
        setItem: (k, v) => void items.set(String(k), String(v)),
        removeItem: (k) => void items.delete(String(k)),
        clear: () => items.clear(),
      };
    };
    for (const name of ["localStorage", "sessionStorage"]) {
      try {
        Object.defineProperty(window, name, { value: memoryStorage(), configurable: true });
      } catch {
        /* leave the page to cope with the throwing original */
      }
    }

    // Pins `value` in place of `obj[name]`: the page can neither
    // reassign nor redefine it. Deliberately not in a try — if an engine
    // refuses, this script stops before "ready" and nothing renders.
    const pin = (obj, name, value) =>
      Object.defineProperty(obj, name, { value, writable: false, configurable: false });

    // The CSP stops every request the page could make except one: WebRTC,
    // whose ICE traffic to a STUN server carries whatever the page puts in
    // it. Take the constructors away, carried over like the storage above.
    for (const name of ["RTCPeerConnection", "webkitRTCPeerConnection", "RTCDataChannel"]) {
      pin(window, name, undefined);
    }

    // A nested frame would bring fresh ones: a `srcdoc` or `javascript:`
    // frame runs its own script in a new window, and the CSP's frame-src
    // stops neither. So frames go as soon as they're added — the observer
    // runs as a microtask, while a frame's document arrives in a later task —
    // in shadow roots too, which `attachShadow` now reports here.
    const FRAMES = "iframe, frame, object, embed";
    const frameWatch = new MutationObserver((records) => {
      for (const { addedNodes } of records) {
        for (const node of addedNodes) {
          if (!(node instanceof Element)) continue;
          if (node.matches(FRAMES)) node.remove();
          for (const frame of node.querySelectorAll(FRAMES)) frame.remove();
        }
      }
    });
    const watch = (root) => frameWatch.observe(root, { childList: true, subtree: true });
    const { attachShadow } = Element.prototype;
    pin(Element.prototype, "attachShadow", function (init) {
      const root = attachShadow.call(this, init);
      watch(root);
      return root;
    });
    // A shadow root declared in markup doesn't pass through attachShadow,
    // and a closed one leaves no handle to watch. So the parser never gets
    // to make one: the attribute asking for it is renamed in everything
    // this page or its scripts hand to the parser.
    const noShadowRoots = (html) => String(html).replace(/shadowrootmode/gi, "data-$&");
    for (const [obj, name] of [
      [Element.prototype, "setHTMLUnsafe"],
      [ShadowRoot.prototype, "setHTMLUnsafe"],
      [Document, "parseHTMLUnsafe"],
    ]) {
      const parse = obj[name];
      if (parse) pin(obj, name, function (html, options) {
        return parse.call(this, noShadowRoots(html), options);
      });
    }
    // Writes all feed one stream, so a name can also arrive split across
    // two of them; a space at the start of the second splits it apart.
    let written = "";
    for (const name of ["write", "writeln"]) {
      const write = Document.prototype[name];
      pin(Document.prototype, name, function (...text) {
        let html = noShadowRoots(text.map(String).join(""));
        if (/shadowrootmode/i.test(written + html.slice(0, 13))) html = " " + html;
        written = (written + html).slice(-13);
        return write.call(this, html);
      });
    }

    // Typing or playing in here never reaches the app's own listeners: its
    // idle lock fired mid-game, and its panic key (Ctrl/Cmd+Shift+L) was dead
    // while this frame had focus. Tell the app — activity at most every few
    // seconds — in the two fixed messages it accepts. `parent` is taken now:
    // the page can replace that property on its window.
    const host = parent;
    let lastPing = 0;
    const ping = () => {
      const now = Date.now();
      if (now - lastPing < 5000) return;
      lastPing = now;
      host.postMessage({ type: "loach-preview:activity" }, "*");
    };
    const report = () => {
      for (const type of ["pointerdown", "pointermove", "keydown", "wheel", "touchstart"]) {
        addEventListener(type, ping, { capture: true, passive: true });
      }
      addEventListener("keydown", (e) => {
        if ((e.ctrlKey || e.metaKey) && e.shiftKey && !e.altKey && String(e.key).toLowerCase() === "l") {
          host.postMessage({ type: "loach-preview:lock" }, "*");
        }
      }, { capture: true });
    };

    addEventListener("message", (e) => {
      const msg = e.data;
      if (e.source !== parent || msg?.type !== "loach-preview:render") return;
      document.open();
      // After open(), which erases this window's listeners, and before the
      // page's own scripts, so these run ahead of anything they add.
      report();
      watch(document);
      document.write(String(msg.html));
      document.close();
    });
    parent.postMessage({ type: "loach-preview:ready" }, "*");
  })();
</script>
